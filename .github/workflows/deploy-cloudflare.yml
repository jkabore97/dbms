name: Deploy to Cloudflare

# Publishes the web build over the `dbms` Worker:
#
#   https://dbms.kabore-boss.workers.dev/
#
# That Worker existed before this workflow and answered "Hello world" — the
# default scaffold, because nothing ever deployed the app onto it. This is the
# thing that does.
#
# Needs one repository secret, under Settings > Secrets and variables >
# Actions:
#
#   CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers"
#                          permission on this account
#
# plus the two Supabase values the app is compiled with, which are already
# set. CLOUDFLARE_ACCOUNT_ID is only needed when the token can see more than
# one account.
#
# Unlike GitHub Pages, nothing here has to be switched on in a settings page
# first: the token is the whole authorisation.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'workers/kaj-app/**'
      - '.github/workflows/deploy-cloudflare.yml'

concurrency:
  group: cloudflare-dbms
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Every job here normally finishes in two to three minutes. The
    # default is six hours, and a stalled runner spends all of it
    # looking like a slow build -- which is how a deploy that never
    # happened goes unnoticed. Fail loudly instead.
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_PROJECT_URL || vars.SUPABASE_PROJECT_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || vars.SUPABASE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # Where photographs go. A repository *variable* rather than a secret:
      # it is a public hostname, and a missing one is not a failure — the app
      # simply hides the camera button rather than showing one that cannot
      # work. Set it to the kaj-uploads Worker's origin once
      # "Deploy the upload Worker" has run.
      UPLOADS_URL: ${{ vars.UPLOADS_URL || secrets.UPLOADS_URL }}
      # The account Worker's origin, for admin password reset and account
      # deletion. A repository *variable*: like UPLOADS_URL, a missing one is
      # not a failure — the app simply hides those two admin actions rather
      # than offering ones that cannot work. Set it once the account Worker
      # has been deployed.
      ACCOUNT_ADMIN_URL: ${{ vars.ACCOUNT_ADMIN_URL || secrets.ACCOUNT_ADMIN_URL }}
      # Crash reporting (README: "Crash reporting"). The DSN ships in every
      # client and can only send, so a variable is fine; empty means off.
      SENTRY_DSN: ${{ vars.SENTRY_DSN || secrets.SENTRY_DSN }}
      # The push Worker's origin (README: "Push notifications"). A public
      # hostname, so a variable; empty means the app offers no push alerts.
      PUSH_URL: ${{ vars.PUSH_URL || secrets.PUSH_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check what this needs is present
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            {
              echo "Empty at deploy time:$missing"
              echo
              echo "All three are repository secrets:"
              echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
              echo
              echo "CLOUDFLARE_API_TOKEN needs the 'Edit Cloudflare Workers'"
              echo "permission. Create one at:"
              echo "  https://dash.cloudflare.com/profile/api-tokens"
              echo
              echo "Deploying without the Supabase values would put a login"
              echo "screen online that only says 'Serveur non configuré' —"
              echo "which is the failure this whole workflow exists to avoid."
            } >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # SQLite compiled to wasm, plus its worker. Generated rather than
      # committed — without this the site loads and then fails the moment it
      # opens its local database.
      - name: Install sqflite web assets
        working-directory: app
        run: dart run sqflite_common_ffi_web:setup

      # The gate. This workflow fires on push to main independently of CI, so
      # without this a merge whose tests were red deployed anyway — the build
      # only had to compile, and a passing compile has already shipped a
      # regression in this project once. Cheaper here than as a workflow_run
      # dependency, which would deploy the wrong commit on a re-run.
      - name: Test before shipping
        working-directory: app
        run: flutter test

      # No --base-href: the Worker serves the app at the root of its hostname,
      # unlike a GitHub Pages project site living under a repository path.
      - name: Build web
        working-directory: app
        run: |
          # --no-web-resources-cdn: bundle CanvasKit and serve it from this
          # Worker's own origin instead of fetching ~1.5 MB from
          # www.gstatic.com on every cold load. A default build imports
          # canvaskit.js from that Google CDN at boot; when the CDN is slow or
          # blocked — a real, everyday condition on a Ouagadougou connection —
          # that fetch never resolves and the page stays blank, which is worst
          # of all on a directly opened or reloaded deep link (there is no
          # warm cache to fall back on). Serving it same-origin removes the
          # dependency entirely and makes every first paint faster.
          flutter build web --release --pwa-strategy none --no-web-resources-cdn \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=UPLOADS_URL="$UPLOADS_URL" \
            --dart-define=ACCOUNT_ADMIN_URL="$ACCOUNT_ADMIN_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=PUSH_URL="$PUSH_URL"
          # --pwa-strategy none stops registering a service worker, but the
          # tool still plants an empty file under this name. Phones that
          # installed the old offline-first worker re-fetch this URL and get
          # the self-destruct from web/, which evicts their stale cache.
          cp web/flutter_service_worker.js build/web/flutter_service_worker.js

      - name: Deploy
        run: npx --yes wrangler@4 deploy --config workers/kaj-app/wrangler.toml

      - name: Say where it went
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://dbms.kabore-boss.workers.dev/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Hard-reload it: a Flutter web build registers a service worker" >> "$GITHUB_STEP_SUMMARY"
          echo "that serves the previous bundle from cache." >> "$GITHUB_STEP_SUMMARY"
          # The optional addresses are compiled in; an empty one silently
          # removes a feature from the build (the camera, the admin account
          # actions, crash reports, push). Say which, here, where the person
          # deploying will read it — a build shipped for days with the camera
          # gone was only explained by digging into this job's env block.
          {
            echo ""
            echo "### What this build can do"
            echo ""
            for pair in "UPLOADS_URL:photos (camera, article pictures)" \
                        "ACCOUNT_ADMIN_URL:admin password reset and account deletion" \
                        "SENTRY_DSN:crash reports" \
                        "PUSH_URL:push notifications"; do
              name="${pair%%:*}"; what="${pair#*:}"
              if [ -n "${!name}" ]; then
                echo "- ✅ $what — \`$name\` set"
              else
                echo "- ⛔ $what — \`$name\` is EMPTY, so this build has no $what."
                echo "::warning::$name is empty: this build ships without $what. Set the repository variable and re-run this workflow."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
