# Temporary: checks that PLAY_SERVICE_ACCOUNT_JSON can reach Mara on
# Google Play (opens an edit, lists the tracks, deletes the edit; nothing
# is changed). Removed once it has run.
name: Play check
on:
  push:
    branches: [claude/dbms-login-page-ef71ta]
    paths: [.github/workflows/play-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -eu
          [ -n "$SA" ] || { echo "PLAY_SERVICE_ACCOUNT_JSON is not set"; exit 1; }
          pip install -q google-auth requests
          python3 - <<'EOF'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          info = json.loads(os.environ["SA"])
          print("service account:", info.get("client_email"))
          c = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/androidpublisher"])
          c.refresh(Request())
          h = {"Authorization": "Bearer " + c.token}
          base = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/bf.kaj.app"
          r = requests.post(base + "/edits", headers=h)
          print("open edit:", r.status_code, r.text[:300] if r.status_code != 200 else "")
          if r.status_code == 200:
              eid = r.json()["id"]
              t = requests.get(f"{base}/edits/{eid}/tracks", headers=h)
              for tr in t.json().get("tracks", []):
                  rel = [(x.get("status"), x.get("versionCodes")) for x in tr.get("releases", [])]
                  print("track", tr["track"], rel)
              l = requests.get(f"{base}/edits/{eid}/listings", headers=h)
              print("listings:", [x.get("language") for x in l.json().get("listings", [])])
              s = requests.get(base + "/subscriptions", headers=h)
              print("subscriptions:", s.status_code, len(s.json().get("subscriptions", [])) if s.ok else s.text[:200])
              requests.delete(f"{base}/edits/{eid}", headers=h)
              print("edit deleted")
          EOF
