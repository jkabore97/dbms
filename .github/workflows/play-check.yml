# Temporary: lists Mara's Google Play tracks and their releases (opens an
# edit, reads, deletes it; nothing changes). Removed once it has run.
name: Play check
on:
  push:
    branches: [claude/dbms-login-page-ef71ta]
    paths: [.github/workflows/play-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tracks
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -eu
          pip install -q google-auth requests
          python3 - <<'EOF'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          c = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SA"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"])
          c.refresh(Request())
          h = {"Authorization": "Bearer " + c.token}
          base = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/bf.kaj.app"
          eid = requests.post(base + "/edits", headers=h).json()["id"]
          for tr in requests.get(f"{base}/edits/{eid}/tracks", headers=h).json().get("tracks", []):
              for rel in tr.get("releases", []):
                  print("track", tr["track"], rel.get("status"), rel.get("name"), rel.get("versionCodes"))
              if not tr.get("releases"):
                  print("track", tr["track"], "empty")
          r = requests.get(f"{base}/edits/{eid}/testers/internal", headers=h)
          print("internal testers", r.status_code, r.text[:300])
          requests.delete(f"{base}/edits/{eid}", headers=h)
          EOF
