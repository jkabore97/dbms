name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    # Every job here normally finishes in two to three minutes. The
    # default is six hours, and a stalled runner spends all of it
    # looking like a slow build -- which is how a deploy that never
    # happened goes unnoticed. Fail loudly instead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm schema.sql exists and isn't empty
        run: test -s database/schema.sql


  test-church-module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/supabase_stub.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/schema.sql
          # Every migration, in number order, rather than a hand-kept list.
          # Two branches have each appended their own line here and produced a
          # run that applied 010 before 006 — the numbers are the contract, so
          # let the shell read them instead of trusting the list to be sorted.
          for migration in database/migrations/*.sql; do
            echo "==> $migration"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_church.sql

      # Runs as the `authenticated` role, never as postgres: a superuser
      # bypasses RLS, so this suite would pass against no policies at all.
      - name: Prove cross-tenant isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_rls.sql

      # Also runs as `authenticated`, and for the same reason: an invitation
      # that grants more than it says would look perfectly fine to a superuser.
      - name: Prove an invitation grants exactly what it says
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_invitations.sql

      # Covers what test_rls.sql structurally could not: church_account_activity
      # is a view, and a view runs as its owner unless told otherwise, so every
      # policy underneath it was being skipped.
      - name: Prove a report shows only what its reader is entitled to
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_reports.sql

      # Letting people type their own category names is only safe if what is
      # underneath is still double-entry. The trial balance assertion is the
      # one that would catch a free-text name having quietly broken it.
      - name: Prove the books still balance when people name their own entries
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_accounting.sql

      # An audit log an administrator can clear is decoration, so most of this
      # suite is the owner of a business trying to erase their own history.
      - name: Prove the activity log cannot be edited by the people it watches
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_audit.sql

      # The farm counts sacks and birds as well as money, and every way that
      # goes wrong makes the farm look more profitable than it is: feed
      # expensed twice, eggs booked as income before anyone pays, an invoice
      # earned once when raised and again when settled.
      - name: Prove the farm module keeps the ledger balanced
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_farm.sql

      # A shop's module can inflate profit in four specific ways: a sale
      # recorded twice by a phone retrying in a market, a return that moves the
      # money but not the goods, a cost price changed later that rewrites an
      # old margin, and debits drifting from credits once sales post through a
      # path contributions do not use.
      - name: Prove a shop's books survive a shop
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_retail.sql

      # Wages are the one number in a small business that must not be visible
      # to the people standing beside it, so most of this suite is somebody
      # trying to read a payroll they are not entitled to — plus the arithmetic
      # failure that matters: paying for the same afternoon twice.
      - name: Prove wages are paid once and seen by few
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_employees.sql

      # The bucket has no row-level security of its own — `org/<org_id>/…` is
      # the whole of the tenancy model in R2 — so the suite that matters here
      # is one shop reaching for another's photographs, plus the two things
      # that would make the module worse than nothing: a capture that requires
      # a field, and an OCR reading that silently becomes a product's expiry.
      - name: Prove a photograph costs nothing to take and cannot be taken
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_capture.sql

      # The only place in the schema that destroys data on purpose. Most of
      # this suite is the ways that could go wrong: an org's own owner
      # deleting the business, a mis-click, a business with books going
      # quietly, and the deletion erasing its own record — audit_log.org_id
      # cascades, so a deleted business takes its audit trail with it.
      - name: Prove a business is hard to destroy and impossible to destroy quietly
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_org_lifecycle.sql

      # M5's demo on the database side: what the invoice reader produces can
      # actually be written, and writing it leaves the books correct. This is
      # the suite that caught receive_products() adding to `quantity` on a
      # retry while the ledger deduplicated — the count and the books drifting
      # apart with nothing on screen to say so.
      - name: Prove a photographed delivery becomes stock and a purchase
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_delivery.sql

      # The two ways into the app. Most of this suite is what filling in a
      # form does not grant: a complete profile with no code belongs to no
      # business, and an application is not a business until somebody decides
      # it is.
      - name: Prove a form grants nothing and an application is not a business
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_onboarding.sql

      # 009 built one farm and it was poultry. This is a farm with goats and
      # onions: a count that cannot go negative, a harvest that is not income,
      # and `flocks` left untouched because Ignace's history is in it.
      - name: Prove a farm can be more than chickens
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_farm_general.sql

      # Invoicing was built inside the farm migration and defaulted its income
      # category to "Ventes d'œufs", so a shop using it kept a wrong set of
      # books. The numbering also read count(*) and added one, which collides
      # the first time two people invoice in the same second — this suite is
      # what asserts both, plus that one business cannot read another's
      # invoices through the new document functions.
      - name: Prove every business can invoice, and only its own
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_invoicing.sql

      # The console reads across every tenant, so its platform-admin check is
      # the only thing between a shopkeeper and a list of every business. This
      # also asserts that paging returns each business exactly once — a gap
      # there hides businesses, which nobody goes looking for.
      - name: Prove the platform console scales and refuses everyone else
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_console.sql

      # The colour is cosmetic; the permission is not. This setting changes
      # what every member of a business sees, so it is gated like renaming
      # one — and the column is deliberately not an enum, which means the
      # shape check is the only thing between it and whatever gets posted.
      - name: Prove only an admin repaints a business, and only their own
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_org_theme.sql

      # "function gen_random_bytes(integer) does not exist" reached a real
      # owner trying to hire: the code minter needed pgcrypto, which is
      # created only in schema.sql and therefore in none of the migration
      # bundles that actually get pasted into Supabase. The invitation suite
      # never caught it because every row in it supplies its own code, so the
      # one function between an admin and a new employee was never called.
      - name: Prove an invitation code can be minted with no extensions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_invitation_codes.sql

      # The carnet de crédit: sales on trust, the market's normal case. The
      # load-bearing claims are that a promise still balances the books, a
      # repayment can reach zero and never cross it, and one shop cannot
      # read another's debtors.
      - name: Prove the credit book balances and stays private
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_credit_book.sql

      # The tontine: whose turn, who paid, and a round that cannot close
      # while somebody has not paid — the contract that keeps notebook
      # tontines out of quarrels.
      - name: Prove the tontine rotates fairly and stays private
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_tontines.sql

      # The transformation tool: flour and oil become cakes, the ingredient
      # cost lands on the cake and nowhere else, and the ledger does not
      # count the same flour twice.
      - name: Prove production moves cost from ingredients to product
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/tests/test_production.sql

  # The upload Worker has no test runner in this repository, so this is the
  # cheapest thing that would have caught the failure it can actually have:
  # a syntax error published straight to production, where the first symptom
  # is every photograph in every business failing at once.
  check-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: node --check workers/uploads/src/index.js
      - run: node --check workers/tenant-router/src/index.js

  flutter-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

# Secrets this workflow will need later — set under Settings > Secrets and variables > Actions.
# Never write real values here or paste them in chat:
#   SUPABASE_URL, SUPABASE_ANON_KEY        (service_role key stays server-side only, never here)
#   CLOUDFLARE_API_TOKEN                    (scoped to Workers + R2 deploy, nothing else)
