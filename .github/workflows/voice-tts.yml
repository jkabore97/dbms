# Temporary (Marakaj v8 films): renders the narration lines listed in .github/voice-lines.json
# ({file, voice, text, speakingRate, markup?, pron?}) with Google Cloud Text-to-Speech (key GCP_TTS_API_KEY), one LINEAR16
# 48 kHz WAV per line, and commits them under v8/<run>/ on the voice-samples branch. Removed once the takes are fetched.
# pron: [{phrase, ipa}] -> input.customPronunciations (IPA), for the name « Marakaj ».
name: Voice samples
on:
  push:
    branches: [claude/dbms-login-page-ef71ta]
    paths: [.github/workflows/voice-tts.yml, .github/voice-lines.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Render
        env:
          KEY: ${{ secrets.GCP_TTS_API_KEY }}
        run: |
          set -eu
          [ -n "$KEY" ] || { echo "GCP_TTS_API_KEY is not set"; exit 1; }
          mkdir out req
          n=$(jq length .github/voice-lines.json)
          cat > synth.sh <<'SH'
          #!/bin/bash
          # $1 = index into voice-lines.json
          i=$1
          item=$(jq -c ".[$i]" .github/voice-lines.json)
          file=$(jq -r .file <<<"$item")
          voice=$(jq -r .voice <<<"$item")
          rate=$(jq -r '.speakingRate // 1.0' <<<"$item")
          call() {  # $1 = request file
            for try in 1 2 3 4; do
              curl -sS -H "X-Goog-Api-Key: $KEY" -H "Content-Type: application/json" -d @"$1" \
                https://texttospeech.googleapis.com/v1/text:synthesize > "req/$i.res"
              if jq -e '.audioContent' "req/$i.res" >/dev/null 2>&1; then
                jq -r '.audioContent' "req/$i.res" | base64 -d > "out/$file"; return 0
              fi
              if jq -e '.error.code == 400' "req/$i.res" >/dev/null 2>&1; then return 1; fi
              sleep $((try * 12))
            done
            return 1
          }
          jq -n --argjson it "$item" --arg v "$voice" --argjson r "$rate" '
            ({} | if $it.markup then .markup = $it.markup else .text = $it.text end
                | if $it.pron then .customPronunciations = {pronunciations: [$it.pron[] | {phrase: .phrase, phoneticEncoding: "PHONETIC_ENCODING_IPA", pronunciation: .ipa}]} else . end) as $in
            | {input: $in, voice: {languageCode: "fr-FR", name: $v}, audioConfig: {audioEncoding: "LINEAR16", sampleRateHertz: 48000, speakingRate: $r}}' > "req/$i.json"
          if call "req/$i.json"; then echo "ok $file"; else echo "fail $file: $(jq -r '.error.message // "no audio"' "req/$i.res")"; fi
          SH
          chmod +x synth.sh
          export KEY
          seq 0 $((n - 1)) | xargs -P 3 -I{} ./synth.sh {} | tee log.txt
          cp .github/voice-lines.json out/lines.json
          cp log.txt out/log.txt
          ok=$(ls out/*.wav 2>/dev/null | wc -l)
          echo "takes: $ok of $n"
          [ "$ok" -gt 0 ]
      - name: Commit them on the voice-samples branch
        run: |
          set -eu
          run=$(jq -r '.[0].run // "v8"' .github/voice-lines.json)
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git clone -q --depth 1 --branch voice-samples --filter=blob:none --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vs
          cd vs
          git sparse-checkout set --no-cone /v8/
          git checkout -q voice-samples
          mkdir -p "v8/$run"
          cp ../out/* "v8/$run/"
          git add -A v8
          git commit -qm "Narration lines (Chirp 3 HD, Marakaj v8, $run)"
          for i in 1 2 3; do git push -q origin voice-samples && break; git pull -q --rebase origin voice-samples; done
