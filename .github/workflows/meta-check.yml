# Temporary: creates Mara's WhatsApp authentication template « mara_code »
# (French, copy-code button, 10-minute expiry), then lists the templates.
# Removed once it has run.
name: Meta check
on:
  push:
    branches: [claude/dbms-login-page-ef71ta]
    paths: [.github/workflows/meta-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Create the template
        env:
          TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          NAME: ${{ secrets.WHATSAPP_TEMPLATE }}
        run: |
          set -u
          G=https://graph.facebook.com/v21.0
          WABA=39044506931863115
          echo "template name secret is mara_code: $([ "$NAME" = mara_code ] && echo yes || echo NO)"
          curl -sS -X POST "$G/$WABA/message_templates" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{
            "name": "mara_code", "language": "fr", "category": "AUTHENTICATION",
            "components": [
              {"type": "BODY", "add_security_recommendation": true},
              {"type": "FOOTER", "code_expiration_minutes": 10},
              {"type": "BUTTONS", "buttons": [{"type": "OTP", "otp_type": "COPY_CODE", "text": "Copier le code"}]}
            ]}'
          echo
          sleep 5
          curl -sS -G "$G/$WABA/message_templates" --data-urlencode "fields=name,status,category,language,rejected_reason" -H "Authorization: Bearer $TOKEN" | python3 -c "import json,sys; [print(t) for t in json.load(sys.stdin).get('data',[])]"
