name: Deploy Web

# Publishes the web build to GitHub Pages so the app can be opened from a
# phone or a laptop without installing anything:
#
#   https://jkabore97.github.io/dbms/
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Until that is set, the deploy step fails saying so.
#
# The page is public — anyone with the link reaches the login screen. That is
# the same exposure as any hosted app: the publishable key is compiled in by
# design and RLS is what protects the data. Signing in still requires a
# Supabase user with a membership row.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time. Queue rather than cancel, so a
# half-finished upload never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_PROJECT_URL || vars.SUPABASE_PROJECT_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || vars.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Supabase secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "Empty at build time:$missing" >&2
            echo "Set them under Settings > Secrets and variables > Actions." >&2
            echo "Publishing without them would put a login screen online that" >&2
            echo "only says 'Serveur non configuré'." >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold platform folders
        working-directory: app
        run: flutter create --platforms=web --project-name kaj_app .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # SQLite compiled to wasm, plus its worker. Generated, never committed,
      # and the scaffold step above rewrites web/ from scratch — without this
      # the site loads and then fails to open its local database.
      - name: Install sqflite web assets
        working-directory: app
        run: dart run sqflite_common_ffi_web:setup

      # The site lives at /dbms/, not at the domain root, so every asset path
      # has to be written relative to that or the page loads blank.
      - name: Build web
        working-directory: app
        run: |
          flutter build web --release \
            --base-href /dbms/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # enablement turns Pages on via the API rather than requiring someone to
      # find the setting first. It needs the repository to allow it; if it
      # cannot, the step fails saying so and the switch has to be flipped by
      # hand at Settings > Pages > Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

      - id: deployment
        uses: actions/deploy-pages@v4
