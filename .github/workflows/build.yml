name: Build App

# Builds the app on GitHub's runners so no Flutter SDK is needed locally.
# Outputs an installable Android APK and a web bundle, both downloadable
# from the run's Artifacts section.
#
# Run manually from the Actions tab ("Run workflow"), or on a push to main.
#
# The Supabase address and publishable key are compiled in here from repository
# secrets. Without them the app builds fine and then tells whoever opens it
# that the server is not configured, so both jobs refuse to build rather than
# hand out an installable that cannot sign anybody in. Set them under
# Settings > Secrets and variables > Actions > Repository secrets:
#   SUPABASE_URL                 https://YOUR-PROJECT.supabase.co
#   SUPABASE_PUBLISHABLE_KEY     the publishable (formerly anon) key
# SUPABASE_ANON_KEY is accepted for the key, since that is what Supabase's
# dashboard still calls it and what ci.yml's own comment asks for.
# The publishable key is meant to ship in clients — RLS is what protects the
# data. The service_role key never belongs in a build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
      - '.github/actions/android-build/**'
  # A pull request that touches the app builds the Android app too, so a
  # change to the Gradle setup or the shrinker rules is proven before it
  # merges — this sandbox has no Android SDK, and CI's Flutter tests do
  # not compile Kotlin. Nothing is published from a pull request.
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
      - '.github/actions/android-build/**'

# Read-only by default (SEC_AUDIT_2 M5). Only main's release job, which
# publishes the APKs to a GitHub release so a shop can download the app
# from a public link (README: "Installing and updating the Android app"),
# writes — releases, nothing else.
permissions:
  contents: read

# The public values every build compiles in, for every job. Secrets first,
# then Actions variables, then the older names. The project URL is not
# sensitive, so a plain variable is a fair place for it. Empty values are
# falsy to `||`, so the first one actually set wins. These stay repository
# secrets or variables: a pull request's build never enters the
# `production` environment.
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_PROJECT_URL || vars.SUPABASE_PROJECT_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || vars.SUPABASE_KEY }}
  # Probed one by one so a failure can say which name carries a value.
  # Only "set"/"empty" is ever printed, never a value.
  PROBE_URL: ${{ secrets.SUPABASE_URL }}
  PROBE_URL_VAR: ${{ vars.SUPABASE_URL }}
  PROBE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  PROBE_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
  PROBE_KEY: ${{ secrets.SUPABASE_KEY }}
  # The Workers' origins, exactly as deploy-cloudflare.yml sources them:
  # public hostnames, so repository variables; missing ones hide the
  # camera and the account actions rather than failing the build.
  UPLOADS_URL: ${{ vars.UPLOADS_URL || secrets.UPLOADS_URL }}
  ACCOUNT_ADMIN_URL: ${{ vars.ACCOUNT_ADMIN_URL || secrets.ACCOUNT_ADMIN_URL }}
  # Crash reporting (README: "Crash reporting"). The DSN ships in every
  # client and can only send, so a variable is fine; empty means off.
  SENTRY_DSN: ${{ vars.SENTRY_DSN || secrets.SENTRY_DSN }}
  # The push Worker's origin (README: "Push notifications"). A public
  # hostname, so a variable; empty means the app offers no push alerts.
  PUSH_URL: ${{ vars.PUSH_URL || secrets.PUSH_URL }}
  PAY_URL: ${{ vars.PAY_URL || secrets.PAY_URL }}

jobs:
  # A pull request (and a manual run on another branch): the Android app
  # built, so a change to the Gradle setup or the shrinker rules is proven
  # before it merges — with the DEBUG key. No upload key, no Google Play
  # account, no Firebase file is handed to it: the pull request's own
  # Gradle and Dart code runs here, and must find no secret to print
  # (SEC_AUDIT_2 M5). Nothing is published.
  build-android:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # Every job here normally finishes in two to three minutes. The
    # default is six hours, and a stalled runner spends all of it
    # looking like a slow build -- which is how a deploy that never
    # happened goes unnoticed. Fail loudly instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-build

  # main — a push or a manual run there: the same build with the upload
  # key, published to the GitHub release and sent to Google Play. Its
  # secrets come through the `production` environment (SEC_AUDIT_2 H1):
  # once the owner limits that environment to main, no branch can read
  # them. Until then it is created on first use, unrestricted, and this
  # runs exactly as before.
  release-android:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    env:
      # The Android upload key (README: "Signing the Android app"). Empty
      # means a debug-signed build, and the job summary says so.
      KAJ_KEYSTORE_BASE64: ${{ secrets.KAJ_KEYSTORE_BASE64 }}
      KAJ_KEYSTORE_PASSWORD: ${{ secrets.KAJ_KEYSTORE_PASSWORD }}
      KAJ_KEY_ALIAS: ${{ secrets.KAJ_KEY_ALIAS }}
      KAJ_KEY_PASSWORD: ${{ secrets.KAJ_KEY_PASSWORD }}
      # Google Play (README: "Publishing to Google Play"): a service
      # account's JSON key with release rights on bf.kaj.app. Empty means
      # the bundle is only attached to the GitHub release.
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      # Android push (README: "Push notifications"): the Firebase project's
      # google-services.json, whole, as a secret. Empty means a build with no
      # Android push — it still builds.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-build

      # The public download link. Every push to main makes one release,
      # tagged by run number and marked latest, so
      #   https://github.com/<owner>/<repo>/releases/latest/download/kaj-arm64-v8a.apk
      # is always the newest build — the address version.json hands to a
      # phone on an older one. A manual run publishes too when it is run on
      # main (120): that is how a build is remade after a secret was added —
      # GOOGLE_SERVICES_JSON, the upload key. Before, such a run built the
      # right APK and published nothing, so the phones kept the last push's
      # build: android-243, made before the Firebase secret existed, was
      # « latest » while run 244 (with it) sat unpublished in Artifacts. A
      # manual run on another branch is the pull request's job: debug key,
      # nothing published.
      - name: Publish the release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${GITHUB_RUN_NUMBER}"
          notes="$(printf '%s\n\n%s\n%s' \
            "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA}." \
            "Most phones: kaj-arm64-v8a.apk. Older 32-bit phones: kaj-armeabi-v7a.apk." \
            "kaj.aab is what the Play Console takes.")"
          gh release create "$tag" \
            --title "Kaj Android build ${GITHUB_RUN_NUMBER}" \
            --notes "$notes" \
            --latest \
            out/kaj-arm64-v8a.apk out/kaj-armeabi-v7a.apk out/kaj.aab
          {
            echo ""
            echo "### Published"
            echo ""
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/kaj-arm64-v8a.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      # Every build of main goes to Google Play by itself: nobody uploads an
      # .aab by hand after the very first one (Google requires that one
      # through the Play Console). The track is the repository variable
      # PLAY_TRACK — internal unless it says otherwise (closed testing: alpha;
      # production) — the owner promotes a release to production from
      # the Play Console — and the version code is the run number, so
      # each upload is newer than the last. Only with the upload key: a
      # debug-signed bundle would be refused anyway.
      - name: Send to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.KAJ_KEYSTORE_BASE64 != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: bf.kaj.app
          releaseFiles: app/out/kaj.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}

      - name: Say where the bundle went
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] && [ -n "$KAJ_KEYSTORE_BASE64" ]; then
            echo "Sent to Google Play, track ${{ vars.PLAY_TRACK || 'internal' }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Not sent to Google Play: PLAY_SERVICE_ACCOUNT_JSON or the upload key is missing." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The public values come from the workflow's env above. No signing key:
    # the web build never used one (SEC_AUDIT_2 M5).
    steps:
      - uses: actions/checkout@v4

      - name: Check the Supabase secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            state() { [ -n "$1" ] && echo set || echo empty; }
            {
              echo "Empty at build time:$missing"
              echo
              echo "What this job can actually read:"
              echo "  secrets.SUPABASE_URL              $(state "$PROBE_URL")"
              echo "  vars.SUPABASE_URL                 $(state "$PROBE_URL_VAR")"
              echo "  secrets.SUPABASE_PUBLISHABLE_KEY  $(state "$PROBE_PUBLISHABLE")"
              echo "  secrets.SUPABASE_ANON_KEY         $(state "$PROBE_ANON")"
              echo "  secrets.SUPABASE_KEY              $(state "$PROBE_KEY")"
              echo
              echo "All empty means the values are not repository Actions secrets."
              echo "They must be at:"
              echo "  Settings > Secrets and variables > Actions > Repository secrets"
              echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
              echo
              echo "Secrets under Codespaces, Dependabot, or an Actions"
              echo "environment are invisible here, as are secrets on a"
              echo "different repository."
              echo
              echo "Building without them produces an app whose login screen"
              echo "only says 'Serveur non configuré'."
            } >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # sqflite runs on SQLite compiled to wasm in the browser; this keeps
      # the checked-in worker and wasm current with the package version.
      - name: Install sqflite web assets
        working-directory: app
        # Tracked in the repository (see app/.gitignore); regenerated only
        # when missing, because the generator's own toolchain can break.
        run: |
          if [ -f web/sqflite_sw.js ] && [ -f web/sqlite3.wasm ]; then
            echo "sqflite web assets are in the repository"
          else
            dart run sqflite_common_ffi_web:setup
          fi

      - name: Build web
        working-directory: app
        run: |
          flutter build web --release --pwa-strategy none \
            --dart-define=BUILD_SHA="$GITHUB_SHA" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=UPLOADS_URL="$UPLOADS_URL" \
            --dart-define=ACCOUNT_ADMIN_URL="$ACCOUNT_ADMIN_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=PUSH_URL="$PUSH_URL" \
            --dart-define=PAY_URL="$PAY_URL"

      # A build that compiles is not a page that renders (CLAUDE.md). The
      # street and one shop's window, opened in Chromium at phone size with
      # the server answered from fixtures: the words a shopper should see
      # must be on the page, and nothing may throw.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Open the public pages in a browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/smoke/smoke.mjs app/build/web

      - name: Keep the smoke screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: kaj-app-web
          path: app/build/web
          if-no-files-found: error
