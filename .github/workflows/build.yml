name: Build App

# Builds the app on GitHub's runners so no Flutter SDK is needed locally.
# Outputs an installable Android APK and a web bundle, both downloadable
# from the run's Artifacts section.
#
# Run manually from the Actions tab ("Run workflow"), or on a push to main.
#
# The Supabase address and publishable key are compiled in here from repository
# secrets. Without them the app builds fine and then tells whoever opens it
# that the server is not configured, so both jobs refuse to build rather than
# hand out an installable that cannot sign anybody in. Set them under
# Settings > Secrets and variables > Actions > Repository secrets:
#   SUPABASE_URL                 https://YOUR-PROJECT.supabase.co
#   SUPABASE_PUBLISHABLE_KEY     the publishable (formerly anon) key
# SUPABASE_ANON_KEY is accepted for the key, since that is what Supabase's
# dashboard still calls it and what ci.yml's own comment asks for.
# The publishable key is meant to ship in clients — RLS is what protects the
# data. The service_role key never belongs in a build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  # A pull request that touches the app builds the Android app too, so a
  # change to the Gradle setup or the shrinker rules is proven before it
  # merges — this sandbox has no Android SDK, and CI's Flutter tests do
  # not compile Kotlin. Nothing is published from a pull request.
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'

# The Android job publishes the APKs to a GitHub release so a shop can
# download the app from a public link (README: "Installing and updating
# the Android app"). That needs write access to releases; nothing else
# here writes anything.
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Every job here normally finishes in two to three minutes. The
    # default is six hours, and a stalled runner spends all of it
    # looking like a slow build -- which is how a deploy that never
    # happened goes unnoticed. Fail loudly instead.
    timeout-minutes: 30
    env:
      # Secrets first, then Actions variables, then the older names. The
      # project URL is not sensitive, so a plain variable is a fair place for
      # it. Empty values are falsy to `||`, so the first one actually set wins.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_PROJECT_URL || vars.SUPABASE_PROJECT_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || vars.SUPABASE_KEY }}
      # Probed one by one so a failure can say which name carries a value.
      # Only "set"/"empty" is ever printed, never a value.
      PROBE_URL: ${{ secrets.SUPABASE_URL }}
      PROBE_URL_VAR: ${{ vars.SUPABASE_URL }}
      PROBE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      PROBE_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
      PROBE_KEY: ${{ secrets.SUPABASE_KEY }}
      # The Workers' origins, exactly as deploy-cloudflare.yml sources them:
      # public hostnames, so repository variables; missing ones hide the
      # camera and the account actions rather than failing the build.
      UPLOADS_URL: ${{ vars.UPLOADS_URL || secrets.UPLOADS_URL }}
      ACCOUNT_ADMIN_URL: ${{ vars.ACCOUNT_ADMIN_URL || secrets.ACCOUNT_ADMIN_URL }}
      # Crash reporting (README: "Crash reporting"). The DSN ships in every
      # client and can only send, so a variable is fine; empty means off.
      SENTRY_DSN: ${{ vars.SENTRY_DSN || secrets.SENTRY_DSN }}
      # The push Worker's origin (README: "Push notifications"). A public
      # hostname, so a variable; empty means the app offers no push alerts.
      PUSH_URL: ${{ vars.PUSH_URL || secrets.PUSH_URL }}
      # The Android upload key (README: "Signing the Android app"). Empty
      # means a debug-signed build, and the job summary says so.
      KAJ_KEYSTORE_BASE64: ${{ secrets.KAJ_KEYSTORE_BASE64 }}
      KAJ_KEYSTORE_PASSWORD: ${{ secrets.KAJ_KEYSTORE_PASSWORD }}
      KAJ_KEY_ALIAS: ${{ secrets.KAJ_KEY_ALIAS }}
      KAJ_KEY_PASSWORD: ${{ secrets.KAJ_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Supabase secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            state() { [ -n "$1" ] && echo set || echo empty; }
            {
              echo "Empty at build time:$missing"
              echo
              echo "What this job can actually read:"
              echo "  secrets.SUPABASE_URL              $(state "$PROBE_URL")"
              echo "  vars.SUPABASE_URL                 $(state "$PROBE_URL_VAR")"
              echo "  secrets.SUPABASE_PUBLISHABLE_KEY  $(state "$PROBE_PUBLISHABLE")"
              echo "  secrets.SUPABASE_ANON_KEY         $(state "$PROBE_ANON")"
              echo "  secrets.SUPABASE_KEY              $(state "$PROBE_KEY")"
              echo
              echo "All empty means the values are not repository Actions secrets."
              echo "They must be at:"
              echo "  Settings > Secrets and variables > Actions > Repository secrets"
              echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
              echo
              echo "Secrets under Codespaces, Dependabot, or an Actions"
              echo "environment are invisible here, as are secrets on a"
              echo "different repository."
              echo
              echo "Building without them produces an app whose login screen"
              echo "only says 'Serveur non configuré'."
            } >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # The upload key, from four repository secrets (README: "Signing the
      # Android app"). Written to the two gitignored files Gradle reads and
      # never printed. Without them the release build falls back to the
      # debug key: still installable for testing, never publishable — and
      # the summary below says which of the two this run produced.
      - name: Install the upload key
        if: env.KAJ_KEYSTORE_BASE64 != ''
        working-directory: app/android
        run: |
          echo "$KAJ_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KAJ_KEYSTORE_PASSWORD"
            echo "keyAlias=$KAJ_KEY_ALIAS"
            echo "keyPassword=$KAJ_KEY_PASSWORD"
          } > key.properties
          echo "Upload key installed; this run is publishable." >> "$GITHUB_STEP_SUMMARY"

      - name: Note an unsigned build
        if: env.KAJ_KEYSTORE_BASE64 == ''
        run: |
          echo "No KAJ_KEYSTORE_BASE64 secret — signed with the debug key: installable for testing, not publishable." >> "$GITHUB_STEP_SUMMARY"

      # Every --dart-define the web deploy passes, or the phone gets an app
      # with no camera and no account admin — a build that compiles and
      # then quietly lacks half its features.
      #
      # --split-per-abi: one APK per processor instead of one carrying all
      # three. Nearly every phone in the field is arm64; the 32-bit one is
      # for the older ones. Neither carries the other's engine, which is
      # what made the single APK weigh what it did. The bundle still holds
      # every ABI — the Play Store splits it itself.
      #
      # BUILD_SHA: the commit this build is made from. The web deploy writes
      # the same commit into version.json, and the app compares the two to
      # know a newer build exists (core/update).
      - name: Build APKs and App Bundle
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=BUILD_SHA="$GITHUB_SHA" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=UPLOADS_URL="$UPLOADS_URL" \
            --dart-define=ACCOUNT_ADMIN_URL="$ACCOUNT_ADMIN_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=PUSH_URL="$PUSH_URL"
          flutter build appbundle --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=BUILD_SHA="$GITHUB_SHA" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=UPLOADS_URL="$UPLOADS_URL" \
            --dart-define=ACCOUNT_ADMIN_URL="$ACCOUNT_ADMIN_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=PUSH_URL="$PUSH_URL"
          # Stable names, so the release's "latest" links never change.
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   out/kaj-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/kaj-armeabi-v7a.apk
          cp build/app/outputs/bundle/release/app-release.aab          out/kaj.aab

      - name: Say what it weighs
        working-directory: app
        run: |
          {
            echo "### Sizes"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in out/kaj-arm64-v8a.apk out/kaj-armeabi-v7a.apk out/kaj.aab; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kaj-app-android
          path: app/out/*
          if-no-files-found: error

      # The public download link. Every push to main makes one release,
      # tagged by run number and marked latest, so
      #   https://github.com/<owner>/<repo>/releases/latest/download/kaj-arm64-v8a.apk
      # is always the newest build — the address version.json hands to a
      # phone on an older one. A manual run of this workflow does not
      # publish: it is for trying a branch, not for shipping it.
      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${GITHUB_RUN_NUMBER}"
          notes="$(printf '%s\n\n%s\n%s' \
            "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA}." \
            "Most phones: kaj-arm64-v8a.apk. Older 32-bit phones: kaj-armeabi-v7a.apk." \
            "kaj.aab is what the Play Console takes.")"
          gh release create "$tag" \
            --title "Kaj Android build ${GITHUB_RUN_NUMBER}" \
            --notes "$notes" \
            --latest \
            out/kaj-arm64-v8a.apk out/kaj-armeabi-v7a.apk out/kaj.aab
          {
            echo ""
            echo "### Published"
            echo ""
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/kaj-arm64-v8a.apk"
          } >> "$GITHUB_STEP_SUMMARY"

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_PROJECT_URL || vars.SUPABASE_PROJECT_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || vars.SUPABASE_KEY }}
      PROBE_URL: ${{ secrets.SUPABASE_URL }}
      PROBE_URL_VAR: ${{ vars.SUPABASE_URL }}
      PROBE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      PROBE_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
      PROBE_KEY: ${{ secrets.SUPABASE_KEY }}
      # The Workers' origins, exactly as deploy-cloudflare.yml sources them:
      # public hostnames, so repository variables; missing ones hide the
      # camera and the account actions rather than failing the build.
      UPLOADS_URL: ${{ vars.UPLOADS_URL || secrets.UPLOADS_URL }}
      ACCOUNT_ADMIN_URL: ${{ vars.ACCOUNT_ADMIN_URL || secrets.ACCOUNT_ADMIN_URL }}
      # Crash reporting (README: "Crash reporting"). The DSN ships in every
      # client and can only send, so a variable is fine; empty means off.
      SENTRY_DSN: ${{ vars.SENTRY_DSN || secrets.SENTRY_DSN }}
      # The push Worker's origin (README: "Push notifications"). A public
      # hostname, so a variable; empty means the app offers no push alerts.
      PUSH_URL: ${{ vars.PUSH_URL || secrets.PUSH_URL }}
      # The Android upload key (README: "Signing the Android app"). Empty
      # means a debug-signed build, and the job summary says so.
      KAJ_KEYSTORE_BASE64: ${{ secrets.KAJ_KEYSTORE_BASE64 }}
      KAJ_KEYSTORE_PASSWORD: ${{ secrets.KAJ_KEYSTORE_PASSWORD }}
      KAJ_KEY_ALIAS: ${{ secrets.KAJ_KEY_ALIAS }}
      KAJ_KEY_PASSWORD: ${{ secrets.KAJ_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Supabase secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            state() { [ -n "$1" ] && echo set || echo empty; }
            {
              echo "Empty at build time:$missing"
              echo
              echo "What this job can actually read:"
              echo "  secrets.SUPABASE_URL              $(state "$PROBE_URL")"
              echo "  vars.SUPABASE_URL                 $(state "$PROBE_URL_VAR")"
              echo "  secrets.SUPABASE_PUBLISHABLE_KEY  $(state "$PROBE_PUBLISHABLE")"
              echo "  secrets.SUPABASE_ANON_KEY         $(state "$PROBE_ANON")"
              echo "  secrets.SUPABASE_KEY              $(state "$PROBE_KEY")"
              echo
              echo "All empty means the values are not repository Actions secrets."
              echo "They must be at:"
              echo "  Settings > Secrets and variables > Actions > Repository secrets"
              echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
              echo
              echo "Secrets under Codespaces, Dependabot, or an Actions"
              echo "environment are invisible here, as are secrets on a"
              echo "different repository."
              echo
              echo "Building without them produces an app whose login screen"
              echo "only says 'Serveur non configuré'."
            } >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # sqflite runs on SQLite compiled to wasm in the browser; this keeps
      # the checked-in worker and wasm current with the package version.
      - name: Install sqflite web assets
        working-directory: app
        run: dart run sqflite_common_ffi_web:setup

      - name: Build web
        working-directory: app
        run: |
          flutter build web --release --pwa-strategy none \
            --dart-define=BUILD_SHA="$GITHUB_SHA" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=UPLOADS_URL="$UPLOADS_URL" \
            --dart-define=ACCOUNT_ADMIN_URL="$ACCOUNT_ADMIN_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=PUSH_URL="$PUSH_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: kaj-app-web
          path: app/build/web
          if-no-files-found: error
