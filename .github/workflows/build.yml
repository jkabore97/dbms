name: Build App

# Builds the app on GitHub's runners so no Flutter SDK is needed locally.
# Outputs an installable Android APK and a web bundle, both downloadable
# from the run's Artifacts section.
#
# Run manually from the Actions tab ("Run workflow"), or on a push to main.
#
# The Supabase address and publishable key are compiled in here from repository
# secrets. Without them the app builds fine and then tells whoever opens it
# that the server is not configured, so both jobs refuse to build rather than
# hand out an installable that cannot sign anybody in. Set them under
# Settings > Secrets and variables > Actions:
#   SUPABASE_URL                 https://YOUR-PROJECT.supabase.co
#   SUPABASE_PUBLISHABLE_KEY     the publishable (formerly anon) key
# The publishable key is meant to ship in clients — RLS is what protects the
# data. The service_role key never belongs in a build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # Secrets first, then Actions variables: the project URL is not sensitive
      # and is a reasonable thing to have stored as a plain variable.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Supabase secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "Empty at build time:$missing" >&2
            echo >&2
            echo "These must live under the repository's ACTIONS secrets:" >&2
            echo "  Settings > Secrets and variables > Actions > Repository secrets" >&2
            echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions" >&2
            echo >&2
            echo "Secrets stored under Codespaces, Dependabot, or an Actions" >&2
            echo "environment are NOT visible here, and the names must match" >&2
            echo "exactly (they are case-sensitive)." >&2
            echo >&2
            echo "Building without them produces an app whose login screen" >&2
            echo "only says 'Serveur non configuré'." >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The repo holds only lib/ and pubspec.yaml. This generates the
      # android/ scaffolding without touching existing files. Once the
      # platform folders are committed, this step can be dropped.
      - name: Scaffold platform folders
        working-directory: app
        run: flutter create --platforms=android --project-name kaj_app .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Debug build: installable on any phone with no signing key.
      # A Play Store release needs an upload keystore, which comes later.
      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: kaj-app-android
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    env:
      # Secrets first, then Actions variables: the project URL is not sensitive
      # and is a reasonable thing to have stored as a plain variable.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Supabase secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "Empty at build time:$missing" >&2
            echo >&2
            echo "These must live under the repository's ACTIONS secrets:" >&2
            echo "  Settings > Secrets and variables > Actions > Repository secrets" >&2
            echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions" >&2
            echo >&2
            echo "Secrets stored under Codespaces, Dependabot, or an Actions" >&2
            echo "environment are NOT visible here, and the names must match" >&2
            echo "exactly (they are case-sensitive)." >&2
            echo >&2
            echo "Building without them produces an app whose login screen" >&2
            echo "only says 'Serveur non configuré'." >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold platform folders
        working-directory: app
        run: flutter create --platforms=web --project-name kaj_app .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # sqflite runs on SQLite compiled to wasm in the browser. The wasm binary
      # and its worker are generated, not checked in, and the scaffold step
      # above recreates web/ from scratch — without this the bundle builds fine
      # and then fails to open its database at runtime.
      - name: Install sqflite web assets
        working-directory: app
        run: dart run sqflite_common_ffi_web:setup

      - name: Build web
        working-directory: app
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: kaj-app-web
          path: app/build/web
          if-no-files-found: error
