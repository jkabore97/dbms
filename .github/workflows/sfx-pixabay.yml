# Temporary: looks for real recorded sound effects on Pixabay in a real browser (Pixabay
# Content License), downloads the candidates and force-pushes them to the
# sfx-pixabay-audio branch. Deleted once the files are fetched.
name: SFX pixabay
on:
  push:
    branches: [sfx-pixabay]
    paths: [.github/workflows/sfx-pixabay.yml, .github/sfx/fetch.mjs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Search and download
        run: |
          set -u
          mkdir w && cp .github/sfx/fetch.mjs w/ && cd w
          npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1
          node fetch.mjs || true
          ls -la out | head -60
      - name: Keep them on a branch
        run: |
          set -eu
          cd w/out
          git init -q -b sfx-pixabay-audio
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Pixabay SFX"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sfx-pixabay-audio
