          JS
          cat > crawl.py <<'PY'
          import html, json, os, re, time, urllib.request
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          for d in ('audio', 'tracks'): os.makedirs('out/' + d, exist_ok=True)
          log = open('out/log.txt', 'a')
          def get(url, binary=False, tries=3):
              for t in range(tries):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': UA, 'Accept-Language': 'en-US,en;q=0.9'}), timeout=60)
                      b = r.read(); log.write(f'200 {len(b)} {url}\n'); return b if binary else b.decode('utf-8', 'replace')
                  except Exception as e:
                      log.write(f'ERR {e} {url}\n'); time.sleep(5 * (t + 1))
              return None
          def text(page):
              t = re.sub(r'(?s)<script.*?</script>|<style.*?</style>', ' ', page); t = html.unescape(re.sub(r'<[^>]+>', ' ', t)); return re.sub(r'\s+', ' ', t)
          ITEMS = json.load(open('items.json'))
          rows = []
          for j in ITEMS:
              time.sleep(0.7)
              page = get(j['url'])
              if not page: continue
              t = text(page)
              lic = sorted(set(re.findall(r'creativecommons\.org/(?:licenses|publicdomain)/[a-z\-]+/[0-9.]+', page)))
              ins = re.search(r'Instrumental (Yes|No)', t); ai = re.search(r'AI generated\? (Yes|No)', t)
              g = re.search(r'Genres? (.{0,120}?) Instrumental', t)
              row = dict(j, licences=lic, instr=ins.group(1) if ins else '?', ai=ai.group(1) if ai else '?', genre=g.group(1) if g else '', content_id=bool(re.search(r'content ?id', t, re.I)))
              row['commercial_ok'] = bool(lic) and all(('-nc' not in l and '-nd' not in l) for l in lic)
              if row['commercial_ok'] and row['ai'] != 'Yes' and j.get('stream'):
                  open(f"out/tracks/{j['id']}.html", 'w').write(page)
                  b = get(j['stream'], binary=True)
                  if b: open(f"out/audio/fma_{j['id']}.mp3", 'wb').write(b); row['file'] = f"audio/fma_{j['id']}.mp3"
              rows.append(row)
          json.dump(rows, open('out/fma.json', 'w'), indent=1, ensure_ascii=False)
          PY
          python3 crawl.py
          tail -n 60 out/log.txt
          ls out/audio | wc -l
