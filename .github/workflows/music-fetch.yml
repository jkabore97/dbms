# Temporary (Marakaj v8 films): fetches candidate music (Free Music Archive, CC BY / CC0 only) and photos
# (Wikimedia Commons, Openverse; CC0 / CC BY only) listed in .github/fetch-list.json, and commits them under v8/ on the
# music-samples branch. Removed once the files are fetched.
name: Music and photo fetch
on:
  push:
    branches: [claude/dbms-login-page-ef71ta]
    paths: [.github/workflows/music-fetch.yml, .github/fetch-list.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Fetch
        run: |
          cat > fetch.py <<'PY'
          """Temporary (Marakaj v8 films): fetch candidate music (Free Music Archive) and photos (Wikimedia Commons, Openverse).
          Reads .github/fetch-list.json; writes into out/ (committed to the music-samples branch under v8/<run>/).

          list = {
            "run": "p1",
            "fma": [{"url": page, "download": bool, "pages": n}],         # album / artist / genre pages; every track's own page is read
            "commons": [{"q": "...", "n": 40}], "openverse": [{"q": "...", "n": 20}],   # pass 1: previews (480 px) + metadata
            "get": [{"file": "x.jpg", "url": "..."}]                       # pass 2: chosen files at full size
          }
          Only CC0 / public domain / CC BY (no NC, ND, SA) is downloaded."""
          import html, json, os, re, sys, time, urllib.parse, urllib.request

          UA = 'MarakajVideoFetch/1.0 (https://marakaj.com; contact via github jkabore97/dbms) python-urllib'
          L = json.load(open('.github/fetch-list.json'))
          RUN = L.get('run', 'run')
          OUT = os.path.join('out', 'v8', RUN)
          os.makedirs(OUT, exist_ok=True)
          log = open(os.path.join(OUT, 'log.txt'), 'w')


          def say(*a):
              s = ' '.join(str(x) for x in a)
              print(s); log.write(s + '\n'); log.flush()


          def get(url, binary=False, tries=3, timeout=60):
              for k in range(tries):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': UA}), timeout=timeout)
                      b = r.read()
                      return b if binary else b.decode('utf-8', 'replace')
                  except Exception as e:  # noqa: BLE001
                      say('  retry', k, url, e)
                      time.sleep(3 + 5 * k)
              return None


          def lic_ok(lics):
              if not lics:
                  return False
              for l in lics:
                  l = l.lower()
                  if any(x in l for x in ('-nc', '-nd', '-sa', 'nc-', 'nd-', 'sa-', '/nc', '/nd', '/sa')):
                      return False
                  if not ('licenses/by/' in l or 'zero' in l or 'publicdomain' in l or l.strip() in ('cc0', 'by', 'pdm')):
                      return False
              return True


          # ------------------------------------------------------------------ music
          def tracks_on(page_html):
              out = []
              for m in re.finditer(r"data-track-info='([^']+)'", page_html):
                  try:
                      out.append(json.loads(html.unescape(m.group(1))))
                  except Exception:  # noqa: BLE001
                      pass
              return out


          def field(page_html, label):
              m = re.search(re.escape(label) + r'\??\s*</span>\s*<span[^>]*>\s*([^<]+?)\s*</span>', page_html)
              return m.group(1).strip() if m else ''


          def music():
              seen = {}
              for src in L.get('fma', []):
                  for p in range(1, src.get('pages', 1) + 1):
                      url = src['url'] + (('&' if '?' in src['url'] else '?') + f'page={p}' if p > 1 else '')
                      h = get(url)
                      if not h:
                          continue
                      ts = tracks_on(h)
                      say('page', url, len(ts), 'tracks')
                      for t in ts:
                          t['_download'] = src.get('download', False) or t.get('_download', False)
                          if t['id'] in seen:
                              seen[t['id']]['_download'] |= t['_download']
                          else:
                              seen[t['id']] = t
                      # an artist page: follow its albums once
                      if src.get('albums'):
                          for a in sorted(set(re.findall(r'href="(https://freemusicarchive\.org/music/[^/"]+/[^/"]+/)"', h))):
                              if a.count('/') != 6 or '/music/charts/' in a:
                                  continue
                              ha = get(a)
                              if not ha:
                                  continue
                              ta = tracks_on(ha)
                              say('  album', a, len(ta))
                              for t in ta:
                                  t['_download'] = src.get('download', False)
                                  seen.setdefault(t['id'], t)
              meta = []
              os.makedirs(os.path.join(OUT, 'tracks'), exist_ok=True)
              os.makedirs(os.path.join(OUT, 'audio'), exist_ok=True)
              n_dl = 0
              for tid, t in seen.items():
                  h = get(t['url'])
                  if not h:
                      continue
                  lics = sorted(set('creativecommons.org/' + x for x in re.findall(r'creativecommons\.org/((?:licenses|publicdomain)/[a-z\-]+/[0-9.]+)', h)))
                  genres = re.findall(r'href="https://freemusicarchive\.org/genre/[^"]+"[^>]*>\s*([^<]+?)\s*<', h)
                  dur = re.search(r'"duration"\s*:\s*"?([0-9:.]+)', h)
                  rec = dict(id=str(tid), title=t.get('title'), artist=t.get('artistName'), album=t.get('albumTitle'), url=t['url'],
                             file_url=t.get('fileUrl'), stream=t.get('playbackUrl'), licences=lics, ok=lic_ok(lics),
                             instr=field(h, 'Instrumental'), ai=field(h, 'AI generated'), genres=genres[:8], duration=dur.group(1) if dur else '')
                  open(os.path.join(OUT, 'tracks', f'{tid}.html'), 'w').write(h)
                  if rec['ok'] and t.get('_download') and rec['ai'].lower() != 'yes' and n_dl < L.get('max_tracks', 60):
                      b = get(t.get('fileUrl') or t['playbackUrl'], binary=True, timeout=180)
                      if b and len(b) > 100000:
                          fn = f'audio/fma_{tid}.mp3'
                          open(os.path.join(OUT, fn), 'wb').write(b)
                          rec['file'] = fn; n_dl += 1
                  meta.append(rec)
                  say('track', tid, rec['artist'], '|', rec['title'], '|', rec['licences'], rec['instr'], rec['ai'], rec.get('file', '-'))
              json.dump(meta, open(os.path.join(OUT, 'fma.json'), 'w'), ensure_ascii=False, indent=1)
              for u in L.get('pages_keep', []):
                  h = get(u)
                  if h:
                      open(os.path.join(OUT, 'pages_' + re.sub(r'[^a-z0-9]+', '_', u.lower())[-80:] + '.html'), 'w').write(h)


          # ------------------------------------------------------------------ photos
          def commons():
              allm = []
              os.makedirs(os.path.join(OUT, 'prev'), exist_ok=True)
              for q in L.get('commons', []):
                  params = dict(action='query', format='json', generator='search', gsrsearch=q['q'] + ' filetype:bitmap', gsrnamespace=6,
                                gsrlimit=q.get('n', 40), prop='imageinfo', iiprop='url|size|extmetadata|mime', iiurlwidth=480)
                  h = get('https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode(params))
                  if not h:
                      continue
                  pages = (json.loads(h).get('query') or {}).get('pages') or {}
                  k = 0
                  for pid, p in sorted(pages.items(), key=lambda kv: kv[1].get('index', 0)):
                      ii = (p.get('imageinfo') or [{}])[0]
                      em = ii.get('extmetadata') or {}
                      v = lambda key: re.sub(r'<[^>]+>', '', html.unescape((em.get(key) or {}).get('value', ''))).strip()
                      lic = v('LicenseShortName'); lurl = v('LicenseUrl')
                      ok = bool(re.match(r'^(CC0|Public domain|PD|CC BY \d|CC-BY-\d|Attribution)', lic, re.I)) and not re.search(r'SA|NC|ND', lic)
                      rec = dict(src='commons', q=q['q'], title=p.get('title'), page=ii.get('descriptionurl'), url=ii.get('url'), w=ii.get('width'), h=ii.get('height'),
                                 mime=ii.get('mime'), licence=lic, licence_url=lurl, artist=v('Artist'), credit=v('Credit')[:300], desc=v('ImageDescription')[:300],
                                 restrictions=v('Restrictions'), ok=ok)
                      if ok and ii.get('thumburl') and (ii.get('mime') or '').startswith('image/'):
                          k += 1
                          fn = f"prev/c_{re.sub(r'[^a-z0-9]+', '_', q['q'].lower())[:30]}_{k:02d}.jpg"
                          b = get(ii['thumburl'], binary=True)
                          if b:
                              open(os.path.join(OUT, fn), 'wb').write(b); rec['prev'] = fn
                      allm.append(rec)
                  say('commons', q['q'], len(pages), 'results', k, 'kept')
                  time.sleep(1)
              json.dump(allm, open(os.path.join(OUT, 'commons.json'), 'w'), ensure_ascii=False, indent=1)


          def openverse():
              allm = []
              os.makedirs(os.path.join(OUT, 'prev'), exist_ok=True)
              for q in L.get('openverse', []):
                  params = dict(q=q['q'], license='cc0,by', page_size=q.get('n', 20), mature='false')
                  h = get('https://api.openverse.org/v1/images/?' + urllib.parse.urlencode(params))
                  if not h:
                      continue
                  res = json.loads(h).get('results', [])
                  k = 0
                  for r in res:
                      rec = dict(src='openverse', q=q['q'], id=r.get('id'), title=r.get('title'), page=r.get('foreign_landing_url'), url=r.get('url'),
                                 w=r.get('width'), h=r.get('height'), licence=f"{r.get('license')} {r.get('license_version')}", licence_url=r.get('license_url'),
                                 artist=r.get('creator'), source=r.get('source'), provider=r.get('provider'), attribution=r.get('attribution'),
                                 ok=(r.get('license') in ('cc0', 'by', 'pdm')))
                      if rec['ok'] and r.get('thumbnail'):
                          k += 1
                          fn = f"prev/o_{re.sub(r'[^a-z0-9]+', '_', q['q'].lower())[:30]}_{k:02d}.jpg"
                          b = get(r['thumbnail'], binary=True, tries=2)
                          if b:
                              open(os.path.join(OUT, fn), 'wb').write(b); rec['prev'] = fn
                          time.sleep(0.4)
                      allm.append(rec)
                  say('openverse', q['q'], len(res), 'results', k, 'kept')
                  time.sleep(2)
              json.dump(allm, open(os.path.join(OUT, 'openverse.json'), 'w'), ensure_ascii=False, indent=1)


          def fetch():
              os.makedirs(os.path.join(OUT, 'full'), exist_ok=True)
              for g in L.get('get', []):
                  b = get(g['url'], binary=True, timeout=180)
                  if b:
                      open(os.path.join(OUT, 'full', g['file']), 'wb').write(b)
                  say('get', g['file'], len(b) if b else 'FAIL', g['url'])
                  if g.get('page'):
                      h = get(g['page'])
                      if h:
                          open(os.path.join(OUT, 'full', g['file'] + '.page.html'), 'w').write(h)
                  time.sleep(0.5)


          for step in sys.argv[1:]:
              {'music': music, 'commons': commons, 'openverse': openverse, 'fetch': fetch}[step]()
          log.close()

          PY
          python3 fetch.py fetch
          du -sh out
      - name: Commit them on the music-samples branch
        run: |
          set -eu
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git clone -q --depth 1 --branch music-samples --filter=blob:none --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ms
          cd ms
          git sparse-checkout set --no-cone /v8/
          git checkout -q music-samples
          cp -r ../out/v8 .
          git add -A v8
          git commit -qm "Marakaj v8: candidate music and photos ($(jq -r .run ../.github/fetch-list.json))"
          for i in 1 2 3; do git push -q origin music-samples && break; git pull -q --rebase origin music-samples; done
