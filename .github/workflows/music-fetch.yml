# Temporary: fetches candidate royalty-free music for the promo films (listing pages,
# licence pages and the audio they link to) and force-pushes them to the
# music-samples branch. Removed once the films are done.
name: Music samples
on:
  push:
    branches: [claude/dbms-login-page-ef71ta]
    paths: [.github/workflows/music-fetch.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  music:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          set +e
          mkdir -p out
          cat > crawl.py <<'PY'
          import html, json, os, re, time, urllib.request, urllib.parse
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          os.makedirs('out/pages', exist_ok=True); os.makedirs('out/audio', exist_ok=True); os.makedirs('out/tracks', exist_ok=True)
          log = open('out/log.txt', 'a')
          def get(url, binary=False, tries=2):
              for t in range(tries):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': UA, 'Accept-Language': 'en-US,en;q=0.9'}), timeout=60)
                      b = r.read(); log.write(f'200 {len(b)} {url} -> {r.geturl()}\n'); return b if binary else b.decode('utf-8', 'replace')
                  except Exception as e:
                      log.write(f'ERR {e} {url}\n'); time.sleep(2)
              return None
          def slug(u): return re.sub(r'[^A-Za-z0-9]+', '_', u.split('://', 1)[-1])[:150]
          # 1. FMA listings
          Q = ['afrobeat', 'afrobeats', 'afro pop', 'afropop', 'amapiano', 'afro house', 'afroswing', 'afro', 'african pop', 'naija', 'azonto', 'highlife', 'log drum']
          lists = [f'https://freemusicarchive.org/search?quicksearch={urllib.parse.quote(q)}&pageSize=100' for q in Q]
          lists += [f'https://freemusicarchive.org/genre/Afrobeat/?pageSize=100&page={p}' for p in (1, 2, 3)]
          lists += ['https://freemusicarchive.org/music/alex-morgan/', 'https://freemusicarchive.org/music/alex-morgan/pop-afro-party-instrumentals/',
                    'https://freemusicarchive.org/music/oibeats/', 'https://freemusicarchive.org/music/creepzz/', 'https://freemusicarchive.org/music/sneaky-club/']
          tracks = {}
          for u in lists:
              s = get(u)
              if not s: continue
              open(f'out/pages/{slug(u)}.html', 'w').write(s)
              for m in re.finditer(r"data-track-info='([^']*)'|data-track-info=\"([^\"]*)\"", s):
                  try: j = json.loads(html.unescape(m.group(1) or m.group(2)))
                  except Exception: continue
                  tracks.setdefault(str(j.get('id')), j)
          rows = []
          for tid, j in tracks.items():
              page = get(j['url'])
              if not page: continue
              open(f'out/tracks/{tid}.html', 'w').write(page)
              lic = sorted(set(re.findall(r'creativecommons\.org/(?:licenses|publicdomain)/[a-z\-]+/[0-9.]+', page)))
              t = re.sub(r'(?s)<script.*?</script>|<style.*?</style>', ' ', page); t = html.unescape(re.sub(r'<[^>]+>', ' ', t)); t = re.sub(r'\s+', ' ', t)
              row = dict(id=tid, title=j.get('title'), artist=j.get('artistName'), url=j['url'], stream=j.get('playbackUrl'), licences=lic,
                         content_id=bool(re.search(r'content ?id', t, re.I)), text_lic=re.findall(r'(?:Attribution[^.]{0,80}|CC0[^.]{0,40}|Public Domain[^.]{0,40})', t)[:4])
              comm = lic and all(('-nc' not in l and '-nd' not in l) for l in lic)
              row['commercial_ok'] = bool(comm)
              if comm and j.get('playbackUrl'):
                  b = get(j['playbackUrl'], binary=True)
                  if b: open(f'out/audio/fma_{tid}.mp3', 'wb').write(b); row['file'] = f'audio/fma_{tid}.mp3'
              rows.append(row)
          json.dump(rows, open('out/fma.json', 'w'), indent=1, ensure_ascii=False)
          # 2. Mixkit searches and licence
          mk = {}
          for q in ['afrobeat', 'afro', 'african', 'africa', 'amapiano', 'dancehall', 'reggaeton', 'tropical', 'latin', 'moombahton', 'tropical-house', 'afro-house', 'percussion', 'summer', 'party']:
              u = f'https://mixkit.co/free-stock-music/discover/{q}/'
              s = get(u)
              if not s: continue
              open(f'out/pages/mixkit_{q}.html', 'w').write(s)
              for m in re.finditer(r'(?s)<script type="application/ld\+json">(.*?)</script>', s):
                  for r in re.finditer(r'\{[^{}]*"@type": ?"MusicRecording"[^{}]*\}', m.group(1)):
                      try: o = json.loads(r.group(0))
                      except Exception: continue
                      o.setdefault('queries', []); mk.setdefault(o['url'], o)['queries'].append(q)
          json.dump(list(mk.values()), open('out/mixkit.json', 'w'), indent=1)
          for o in mk.values():
              n = re.search(r'/music/(\d+)/', o['url']).group(1)
              if os.path.exists(f'out/audio/mixkit_{n}.mp3'): continue
              b = get(o['url'], binary=True)
              if b: open(f'out/audio/mixkit_{n}.mp3', 'wb').write(b)
          s = get('https://mixkit.co/license/')
          for js in re.findall(r'https://assets\.mixkit\.co/build/[^"]+\.js', s or ''):
              b = get(js)
              if b: open(f'out/pages/{slug(js)}.js', 'w').write(b)
          for u in ['https://mixkit.co/license/music-free/', 'https://mixkit.co/license/musicFree/', 'https://mixkit.co/license/?license=musicFree', 'https://mixkit.co/license/modal/musicFree']:
              b = get(u)
              if b: open(f'out/pages/{slug(u)}.html', 'w').write(b)
          PY
          python3 crawl.py
          tail -n 60 out/log.txt
          ls out/audio | wc -l
      - name: Keep them on the music-samples branch
        if: always()
        run: |
          set -eu
          cd out
          git init -q -b music-samples
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Candidate music (FMA and Mixkit crawl)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" music-samples
