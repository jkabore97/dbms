# Temporary: activates Mara Pro's two base plans on Google Play, so test
# purchases can run. Removed once it has run.
name: Play subscriptions
on:
  push:
    branches: [claude/dbms-login-page-ef71ta]
    paths: [.github/workflows/play-subs.yml]
jobs:
  subs:
    runs-on: ubuntu-latest
    steps:
      - name: Activate
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -eu
          pip install -q google-auth requests
          python3 - <<'EOF'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          c = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SA"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"])
          c.refresh(Request())
          h = {"Authorization": "Bearer " + c.token}
          url = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/bf.kaj.app/subscriptions/mara_pro"
          for bp in ("monthly", "yearly"):
              r = requests.post(f"{url}/basePlans/{bp}:activate", headers=h,
                                json={"packageName": "bf.kaj.app", "productId": "mara_pro", "basePlanId": bp})
              print("activate", bp, r.status_code, "" if r.ok else r.text[:500])
          for bp in requests.get(url, headers=h).json()["basePlans"]:
              print("now", bp["basePlanId"], bp.get("state"))
          EOF
