# Temporary: sets Mara Pro's West African (CFA franc zone) prices on Google
# Play to 2 900 / 29 900 FCFA. Removed once it has run.
name: Play subscriptions
on:
  push:
    branches: [claude/dbms-login-page-ef71ta]
    paths: [.github/workflows/play-subs.yml]
jobs:
  subs:
    runs-on: ubuntu-latest
    steps:
      - name: Prices
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -eu
          pip install -q google-auth requests
          python3 - <<'EOF'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          c = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SA"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"])
          c.refresh(Request())
          h = {"Authorization": "Bearer " + c.token}
          url = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/bf.kaj.app/subscriptions/mara_pro"
          sub = requests.get(url, headers=h).json()
          # The eight countries of the West African CFA franc (XOF); fixed peg 1 EUR = 655.957 XOF.
          zone = {"BJ", "BF", "CI", "GW", "ML", "NE", "SN", "TG"}
          want = {"monthly": 2900, "yearly": 29900}
          def price(currency, xof):
              if currency == "XOF":
                  return {"currencyCode": "XOF", "units": str(xof)}
              if currency == "EUR":
                  cents = round(xof / 655.957 * 100)
                  return {"currencyCode": "EUR", "units": str(cents // 100), "nanos": (cents % 100) * 10_000_000}
              return None
          for bp in sub["basePlans"]:
              for rc in bp["regionalConfigs"]:
                  if rc["regionCode"] in zone:
                      new = price(rc["price"]["currencyCode"], want[bp["basePlanId"]])
                      print(bp["basePlanId"], rc["regionCode"], rc["price"], "->", new)
                      if new:
                          rc["price"] = new
          ver = requests.post("https://androidpublisher.googleapis.com/androidpublisher/v3/applications/bf.kaj.app/pricing:convertRegionPrices",
                              headers=h, json={"price": {"currencyCode": "USD", "units": "4", "nanos": 990000000}}).json()["regionVersion"]["version"]
          print("regions version", ver)
          r = requests.patch(url, headers=h, json=sub,
                             params={"updateMask": "basePlans", "regionsVersion.version": ver})
          print("patch", r.status_code, "" if r.ok else r.text[:800])
          after = requests.get(url, headers=h).json()
          for bp in after["basePlans"]:
              for rc in bp["regionalConfigs"]:
                  if rc["regionCode"] in zone:
                      print("now", bp["basePlanId"], bp.get("state"), rc["regionCode"], rc["price"])
          EOF
