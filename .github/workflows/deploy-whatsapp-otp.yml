name: Deploy the WhatsApp code Worker

# Publishes workers/whatsapp-otp — the Worker Supabase's « Send SMS » auth
# hook posts to, which sends the code that proves a shopper's number with
# the WhatsApp Cloud API (migration 109). BUILD_PLAN.md, « Numéros vérifiés
# par WhatsApp (109) », lists the one-time setup: Meta, the template, the
# token, the hook, these secrets.
#
# Dormant until the owner has made all four repository secrets
# (WHATSAPP_TOKEN, WHATSAPP_PHONE_ID, WHATSAPP_TEMPLATE,
# SEND_SMS_HOOK_SECRET): without them the job runs the Worker's tests, says
# so and succeeds, and nothing is deployed. Kept apart from « Deploy to
# Cloudflare » like the other Workers holding a secret: a mistake here must
# not stop the app itself going out.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/whatsapp-otp/**'
      - '.github/workflows/deploy-whatsapp-otp.yml'

concurrency:
  group: cloudflare-whatsapp-otp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The production secrets come through the `production` environment
    # (SEC_AUDIT_2 H1): once the owner limits it to main, no other branch
    # can read them. README, « Secrets and the production environment ».
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # Secrets: set by the owner in GitHub, handed to Cloudflare's secret
      # store below, never printed and never in the repository.
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
      SEND_SMS_HOOK_SECRET: ${{ secrets.SEND_SMS_HOOK_SECRET }}
      # Meta's webhook, optional: the verify token typed at Meta
      # and the Mara app's App secret, which signs every event.
      META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      # The ration (130, SEC_AUDIT_2 M6): the Worker asks the database's
      # otp_send_allow() before each code. Without these two it counts in
      # its own memory (weaker) and says so below.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_PROJECT_URL || vars.SUPABASE_PROJECT_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: The Worker's own tests
        run: node --test workers/whatsapp-otp/test/*.test.mjs

      - name: Say so when WhatsApp is not set up yet
        id: ready
        run: |
          missing=""
          [ -n "$WHATSAPP_TOKEN" ] || missing="$missing WHATSAPP_TOKEN"
          [ -n "$WHATSAPP_PHONE_ID" ] || missing="$missing WHATSAPP_PHONE_ID"
          [ -n "$WHATSAPP_TEMPLATE" ] || missing="$missing WHATSAPP_TEMPLATE"
          [ -n "$SEND_SMS_HOOK_SECRET" ] || missing="$missing SEND_SMS_HOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::notice::Not set yet:$missing — the WhatsApp code Worker was not deployed. BUILD_PLAN.md, « Numéros vérifiés par WhatsApp (109) »."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the Cloudflare token is one Cloudflare accepts
        if: steps.ready.outputs.go == 'true'
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN is empty." >&2; exit 1; }
          body=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify) || true
          case "$body" in
            *'"success":true'*) echo "Token accepted by Cloudflare." ;;
            *) echo "Cloudflare rejected CLOUDFLARE_API_TOKEN." >&2; echo "$body" >&2; exit 1 ;;
          esac

      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            npx --yes wrangler@4 deploy --config workers/whatsapp-otp/wrangler.toml --var "SUPABASE_URL:$SUPABASE_URL"
          else
            npx --yes wrangler@4 deploy --config workers/whatsapp-otp/wrangler.toml
          fi

      # Secrets through wrangler's store — never as --var, which would print
      # them in the deploy log.
      - name: Install the secrets
        if: steps.ready.outputs.go == 'true'
        run: |
          printf '%s' "$WHATSAPP_TOKEN"       | npx --yes wrangler@4 secret put WHATSAPP_TOKEN       --config workers/whatsapp-otp/wrangler.toml
          printf '%s' "$WHATSAPP_PHONE_ID"    | npx --yes wrangler@4 secret put WHATSAPP_PHONE_ID    --config workers/whatsapp-otp/wrangler.toml
          printf '%s' "$WHATSAPP_TEMPLATE"    | npx --yes wrangler@4 secret put WHATSAPP_TEMPLATE    --config workers/whatsapp-otp/wrangler.toml
          printf '%s' "$SEND_SMS_HOOK_SECRET" | npx --yes wrangler@4 secret put SEND_SMS_HOOK_SECRET --config workers/whatsapp-otp/wrangler.toml
          if [ -n "$META_VERIFY_TOKEN" ] && [ -n "$META_APP_SECRET" ]; then
            printf '%s' "$META_VERIFY_TOKEN" | npx --yes wrangler@4 secret put META_VERIFY_TOKEN --config workers/whatsapp-otp/wrangler.toml
            printf '%s' "$META_APP_SECRET"   | npx --yes wrangler@4 secret put META_APP_SECRET   --config workers/whatsapp-otp/wrangler.toml
            echo "Meta's webhook is ready at /v1/meta." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Meta's webhook is off (META_VERIFY_TOKEN / META_APP_SECRET missing)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx --yes wrangler@4 secret put SUPABASE_SERVICE_ROLE_KEY --config workers/whatsapp-otp/wrangler.toml
            echo "The ration is the database's (otp_send_allow, 130)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY missing: the codes are rationed in the Worker's memory only."
            echo "The ration is the Worker's memory only (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY missing)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Say what is left to do
        if: steps.ready.outputs.go == 'true'
        run: |
          {
            echo "### WhatsApp code Worker deployed"
            echo
            echo "1. Open \`<kaj-whatsapp-otp origin>/v1/health\`: it must say \`{\"ready\":true}\`."
            echo "2. In Supabase: Authentication → Auth Hooks → Send SMS hook → HTTPS, URL \`<kaj-whatsapp-otp origin>/v1/send-sms\`, the same secret as SEND_SMS_HOOK_SECRET."
            echo "3. Command center → Réglages → « Numéro WhatsApp vérifié avant de commander » → Oui; order from a vitrine with an account that has no proved number: the code must arrive on WhatsApp."
            echo "4. If it does not arrive, put the switch back to Non (« Annuler » in the Journal) — ordering is then as before."
          } >> "$GITHUB_STEP_SUMMARY"
