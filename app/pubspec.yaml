name: kaj_app
description: Kaj-consulting multi-tenant business management app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Web-only, and reached only through core/nav/url_strategy.dart, whose
  # conditional export keeps it out of the Android build entirely. All it does
  # is drop the `#` from every address.
  flutter_web_plugins:
    sdk: flutter

  # Local-first storage. The device is the source of truth; the server is
  # a replica it catches up with when there's signal.
  sqflite: ^2.3.3
  path: ^1.9.0

  # sqflite's native implementation doesn't exist in a browser. On web the
  # database factory is swapped for this one, which runs SQLite compiled to
  # wasm against IndexedDB. Without it the app throws on the first query and
  # renders nothing at all.
  #
  # Requires the wasm binary and worker in web/ — regenerate with:
  #   dart run sqflite_common_ffi_web:setup
  #
  # Keep this major version in step with the `sqlite3` package it resolves
  # against: setup downloads a sqlite3.wasm pinned to a matching release, and a
  # mismatch fails at WebAssembly.instantiate with a missing "env" import.
  sqflite_common_ffi_web: ^1.1.2

  # Client-generated ids so records can be created with no connection and
  # still be uniquely identified when they finally sync.
  uuid: ^4.4.0

  # Hashing for the device PIN that guards offline re-entry. The PIN itself is
  # never stored — see core/auth/pin_codec.dart.
  crypto: ^3.0.3

  # Backend (Postgres + auth). Only touched by SyncService.
  supabase_flutter: ^2.5.6

  # Currency and date formatting for fr / XOF.
  intl: ^0.19.0

  # Detects when the connection comes back so sync can fire automatically.
  connectivity_plus: ^6.0.3

  # Renders an invitation code as a QR. Most of the people being invited are
  # standing next to the person inviting them, so the fastest handover is one
  # phone pointed at another — and it removes the chance of mistyping a code
  # read aloud in a noisy room.
  qr_flutter: ^4.1.0

  # Sends the weekly summary out of the app as an image. The destination is
  # WhatsApp — that is where a pastor's leadership group already lives, and a
  # report nobody can forward is a report nobody reads.
  share_plus: ^13.3.0

  # The camera button. Works on both ship targets: an intent on Android, a
  # file input with `capture` on web. No platform scaffolding is added by it,
  # which is why it was chosen over a full camera package — M5 needs one
  # photograph, not a viewfinder.
  image_picker: ^1.1.2

  # Talks to the upload Worker. Supabase's client cannot be used for it: the
  # bytes go to Cloudflare, not to PostgREST, and every read is authorised, so
  # the request has to carry an Authorization header — which is exactly what
  # an <img> tag on the web cannot do and why photographs are fetched as
  # bytes and rendered from memory.
  http: ^1.2.2

  # Reading a barcode with the camera. Works on both ship targets — a native
  # detector on Android, the browser's own on web — which is why the scan
  # button is offered everywhere rather than hidden behind a platform check.
  mobile_scanner: ^7.4.0

  # On-device text recognition, Android only. There is no web implementation
  # and there is not going to be one, so nothing outside
  # core/capture/text_reader_mobile.dart may import this: the web build must
  # never see it. See text_reader.dart for how that is arranged.
  google_mlkit_text_recognition: ^0.16.0

  # Every screen is a real page with its own address, so the browser back
  # button, a refresh and a bookmark all mean what they say. Before this, the
  # whole app lived at "/" and moving between sign-in, the business picker and
  # a business was a setState -- so back from inside a business left the app
  # entirely rather than returning to the picker.
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Runs the real SQLite engine inside `flutter test`, so the auth and org
  # tests exercise the same schema and queries the phone does rather than a
  # mock that agrees with whatever the code happens to do.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
