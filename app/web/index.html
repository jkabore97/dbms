  <meta charset="UTF-8">

  <meta name="theme-color" content="#4A3122">

  <!--
    What a shared link looks like on WhatsApp and elsewhere. A vitrine
    travels from one phone to the next as a link, and the preview card is
    the first thing the next person sees — it must say Mara, not "a new
    Flutter project". The image is absolute because previewers do not
    resolve relative paths.
  -->

  <title>Mara — Au Service du Peuple</title>

  <style>
    /*
      The page before the app: Mara's seal on dark brown, one thin caramel line
      moving. Flutter's engine takes a few seconds to arrive on a market's
      connection, and a blank tab for that long reads as "broken". The
      app's own splash is the same seal on the same brown, so its first
      frame replaces this one without a jump.
    */
    html, body { margin: 0; height: 100%; background: #4A3122; }
    #mara-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #4A3122;
      transition: opacity 260ms ease-out;
    }
    /* The seal is inside this page (a data URI), not a file: on a market
       connection the engine and the app take twenty seconds and more, and a
       separate picture arrived last, behind them — a blank page for the
       whole wait. */
    #mara-splash img { width: 160px; height: 200px; }
    #mara-splash .line {
      margin-top: 28px; width: 96px; height: 2px; background: rgba(244, 242, 238, 0.18);
      overflow: hidden; border-radius: 2px;
    }
    #mara-splash .line::after {
      content: ""; display: block; width: 40%; height: 100%; background: #C49A6C;
      animation: mara-slide 1.1s ease-in-out infinite;
    }
    @keyframes mara-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    #mara-splash .slow {
      margin-top: 18px; font: 15px/1.4 system-ui, sans-serif;
      color: rgba(244, 242, 238, 0.78); opacity: 0; transition: opacity 400ms;
      text-align: center; padding: 0 24px;
    }
    #mara-splash .slow.on { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      #mara-splash .line::after { animation: none; width: 100%; }
    }
  </style>
</head>

  <script>
    // Still here after eight seconds: say it is the connection, not Mara —
    // a still page for that long reads as « broken » and gets closed.
    setTimeout(function () {
      var slow = document.getElementById('mara-slow');
      if (!slow) return;
      if ((navigator.language || 'fr').slice(0, 2) === 'en') {
        slow.textContent = 'Slow connection — Mara is on its way…';
      }
      slow.className = 'slow on';
    }, 8000);
    // The engine says when it has painted; the brown page steps aside.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('mara-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
