<html lang="fr">
<head>
  <!--
    The base href is a placeholder replaced by `flutter build --base-href`;
    the app is served from the root, so it resolves to "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Marakaj, au service du peuple. Les boutiques près de vous : leurs articles, leurs prix, leurs livraisons. Et pour les commerçants, la caisse, le stock et la vitrine en ligne.">
  <meta name="theme-color" content="#3B3A38">

  <!--
    What a shared link looks like on WhatsApp and elsewhere. A vitrine
    travels from one phone to the next as a link, and the preview card is
    the first thing the next person sees — it must say Marakaj, not "a new
    Flutter project". The image is absolute because previewers do not
    resolve relative paths.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Marakaj">
  <meta property="og:title" content="Marakaj — Au Service du Peuple">
  <meta property="og:description" content="Leurs articles, leurs prix, leurs livraisons. Commandez à emporter ou en livraison.">
  <meta property="og:image" content="https://marakaj.com/brand/og.jpg">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="500">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Installed on a phone's home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marakaj">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!--
    Asked for now, alongside the app, rather than one after the other once
    it runs: the local database's engine (fetched by its worker as the app
    starts) and the fonts (fetched by the engine before it can draw a
    letter). On 3G that order left the line idle for seconds before the
    first frame. The fonts' folder is written by the deploy
    (scripts/web-fingerprint.mjs).
  -->
  <link rel="preload" href="sqflite_sw.js" as="fetch" crossorigin>
  <link rel="preload" href="sqlite3.wasm" as="fetch" type="application/wasm" crossorigin>
  <!--MARA_PRELOAD-->

  <title>Marakaj — Au Service du Peuple</title>

  <style>
    /*
      The page before the app: Mara's seal on graphite, one thin caramel line
      moving. Flutter's engine takes a few seconds to arrive on a market's
      connection, and a blank tab for that long reads as "broken". The
      app's own splash is the same seal on the same graphite, so its first
      frame replaces this one without a jump.
    */
    html, body { margin: 0; height: 100%; background: #3B3A38; }
    #mara-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #3B3A38;
      transition: opacity 260ms ease-out;
    }
    #mara-splash[hidden] { display: none; }
    /* The seal is drawn inside this page (vector, 3 KB compressed): it is
       the first thing the phone receives, and on a market connection the
       engine and the app take twenty seconds and more. A separate picture
       arrived last, behind them; the picture that replaced it was 46 KB of
       base64 the page could not start painting before. */
    #mara-splash svg { width: 160px; height: 200px; }
    #mara-splash .line {
      margin-top: 28px; width: 96px; height: 2px; background: rgba(244, 242, 238, 0.18);
      overflow: hidden; border-radius: 2px;
    }
    #mara-splash .line::after {
      content: ""; display: block; width: 40%; height: 100%; background: #C49A6C;
      animation: mara-slide 1.1s ease-in-out infinite;
    }
    @keyframes mara-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    #mara-splash .slow, #mara-splash .fail p {
      margin: 18px 0 0; font: 15px/1.4 system-ui, sans-serif;
      color: rgba(244, 242, 238, 0.78); text-align: center; padding: 0 24px;
    }
    #mara-splash .slow { opacity: 0; transition: opacity 400ms; }
    #mara-splash .slow.on { opacity: 1; }
    #mara-splash .fail { display: flex; flex-direction: column; align-items: center; }
    #mara-splash .fail[hidden] { display: none; }
    #mara-splash .fail button {
      margin-top: 16px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 24px;
      background: #C49A6C; color: #0E0D0C; font: 600 16px/1 system-ui, sans-serif; cursor: pointer;
    }
    /* Who this is and where its policies are, in the page itself: what a
       visitor sees while the app loads, and all a reader without
       JavaScript (Google's verification among them) ever sees. */
    #mara-splash .about {
      position: absolute; left: 0; right: 0; bottom: 20px; padding: 0 20px;
      text-align: center; font: 13px/1.5 system-ui, sans-serif;
      color: rgba(244, 242, 238, 0.72);
    }
    #mara-splash .about h1 { margin: 0 0 2px; font-size: 13px; font-weight: 700; color: #F4F2EE; }
    #mara-splash .about p { margin: 0 0 6px; }
    #mara-splash .about a { color: #C49A6C; text-decoration: none; }
    @media (prefers-reduced-motion: reduce) {
      #mara-splash .line::after { animation: none; width: 100%; }
    }
  </style>
</head>

        slow: 'Slow connection — Marakaj is on its way…',
        fail: 'The connection dropped before Marakaj finished loading.',
        offline: 'No connection. Marakaj opens as soon as the network is back.',
        retry: 'Try again',
        update: 'Updating Marakaj…'
      } : {
        slow: 'Connexion lente — Marakaj arrive…',
        fail: 'La connexion a coupé avant la fin du chargement.',
        offline: 'Pas de connexion. Marakaj s’ouvre dès que le réseau revient.',
        retry: 'Réessayer',
        update: 'Mise à jour de Marakaj…'
      };
      var sw = 'serviceWorker' in navigator ? navigator.serviceWorker : null;
      var splash = document.getElementById('mara-splash');
      var slow = document.getElementById('mara-slow');
      var failBox = document.getElementById('mara-fail');
      var retry = document.getElementById('mara-retry');
      var painted = false;
      var started = false;
      retry.textContent = say.retry;
      // What arrived is kept (the browser's cache, the service worker):
      // trying again asks only for what is missing.
      retry.onclick = function () { heal(true); };

      // A phone's kept copy of an older build can ask for files the site no
      // longer has (each deploy replaces them): then loading stops, and
      // reloading the same copy stops again. The cure is the network: the
      // kept copy is let go (the worker and its shell — the app's own data,
      // the local database, is not touched) and the page comes again from
      // the site. Once by itself per tab; the button always.
      function heal(asked) {
        var reload = function () { location.reload(); };
        if (!sw || !sw.controller) {
          if (asked) reload();
          return false;
        }
        try {
          if (!asked && sessionStorage.getItem('mara-healed')) return false;
          sessionStorage.setItem('mara-healed', '1');
        } catch (e) { if (!asked) return false; }
        sw.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          return window.caches ? caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) { return k.indexOf('mara-shell-') === 0; })
              .map(function (k) { return caches.delete(k); }));
          }) : null;
        }).then(reload, reload);
        return true;
      }

      // Loading stopped: say why in a word and offer the one thing to do.
      function fail() {
        if (painted) return;
        if (navigator.onLine !== false && heal(false)) return;
        // Nothing is moving any more: the line says so too.
        splash.querySelector('.line').style.visibility = 'hidden';
        slow.className = 'slow';
        document.getElementById('mara-fail-text').textContent =
          navigator.onLine === false ? say.offline : say.fail;
        failBox.hidden = false;
      }
      // A file of the app that did not come (a script tag's error)…
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t.tagName === 'SCRIPT') fail();
      }, true);
      // …no network while the files must come from it (a phone that keeps
      // Mara opens from its copy: no network is no matter there)…
      function cut() {
        return navigator.onLine === false && !(sw && sw.controller);
      }
      window.addEventListener('offline', function () {
        setTimeout(function () { if (cut()) fail(); }, 3000);
      });
      // …or nothing at all arriving for a minute and a half.
      var seen = -1, quietSince = Date.now();
      var watch = setInterval(function () {
        if (painted) { clearInterval(watch); return; }
        if (cut()) fail();
        var n = performance.getEntriesByType('resource').length;
        if (n !== seen) { seen = n; quietSince = Date.now(); }
        else if (Date.now() - quietSince > 90000) fail();
      }, 3000);

      // Still here after eight seconds: say it is the connection, not Mara
      // — a still page for that long reads as « broken » and gets closed.
      setTimeout(function () {
        if (painted || !failBox.hidden) return;
        slow.textContent = say.slow;
        slow.className = 'slow on';
      }, 8000);

      // The engine says when it has painted; the graphite page steps aside.
      window.addEventListener('flutter-first-frame', function () {
        painted = true;
        splash.style.opacity = '0';
        setTimeout(function () { splash.hidden = true; }, 300);
        keepForNextTime();
      });

      function start() {
        if (started) return;
        started = true;
        _flutter.loader.load({
          config: PATHS,
          onEntrypointLoaded: function (engine) {
            engine.initializeEngine(PATHS)
              .then(function (app) { return app.runApp(); })
              .catch(fail);
          }
        }).catch(fail);
      }

      // A newer build the phone has already prepared (mara_sw.js, waiting
      // since a deploy) is taken now, before this one runs: one reload, all
      // of it from the phone.
      if (sw && sw.controller && VERSION) {
        var go = function () { start(); };
        var asked = setTimeout(go, 1000);
        sw.getRegistration().then(function (reg) {
          clearTimeout(asked);
          if (reg && reg.waiting) {
            sw.addEventListener('controllerchange', function () { location.reload(); });
            reg.waiting.postMessage({ type: 'activate' });
            setTimeout(go, 4000);
          } else {
            go();
          }
        }, go);
      } else {
        start();
      }

      // The worker that keeps the app for the next visit. Registered once
      // the app shows, so the first visit's bandwidth all goes to the app;
      // the files it loaded are then handed over, from the browser's own
      // cache — nothing is downloaded twice.
      function keepForNextTime() {
        if (!sw || !VERSION) return;
        sw.register('/mara_sw.js', { scope: '/', updateViaCache: 'none' }).then(function () {
          setTimeout(function () {
            var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            sw.ready.then(function (reg) {
              if (reg.active) reg.active.postMessage({ type: 'warm', urls: urls });
            });
          }, 3000);
        }, function () {});
      }

      // « Recharger » in the update banner (core/update/reload_web.dart):
      // the new build, now. Taken from the worker as soon as it has it
      // ready; straight from the network when it cannot be ready in time.
      window.maraUpdate = function () {
        slow.textContent = say.update;
        slow.className = 'slow on';
        failBox.hidden = true;
        splash.querySelector('.line').style.visibility = 'visible';
        splash.hidden = false;
        splash.style.opacity = '1';
        var gone = false;
        var reload = function () { if (!gone) { gone = true; location.reload(); } };
        var fromNetwork = function () {
          if (gone) return;
          sw.getRegistration().then(function (reg) {
            return reg ? reg.unregister() : null;
          }).then(reload, reload);
        };
        if (!sw || !sw.controller) { reload(); return; }
        sw.addEventListener('controllerchange', reload);
        setTimeout(fromNetwork, 45000);
        sw.getRegistration().then(function (reg) {
          if (!reg) return reload();
          var take = function (w) { w.postMessage({ type: 'activate' }); };
          var follow = function (w) {
            if (!w) return;
            w.addEventListener('statechange', function () {
              if (w.state === 'installed') take(w);
              else if (w.state === 'redundant') fromNetwork();
            });
          };
          if (reg.waiting) return take(reg.waiting);
          if (reg.installing) return follow(reg.installing);
          reg.addEventListener('updatefound', function () { follow(reg.installing); });
          return reg.update().then(function () {
            if (reg.waiting) take(reg.waiting);
            else if (!reg.installing) fromNetwork();
          }, fromNetwork);
        }, fromNetwork);
      };
    })();
  </script>
</body>
</html>
